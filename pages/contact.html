<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #f4f6f8;
        color: #333;
        font-family: Arial, Helvetica, sans-serif;
      }

      #contact {
        padding: 40px 20px;
      }

      .contact-form {
        width: 400px;
        max-width: 100%;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #8c8fbc;
        border-radius: 4px;
        background-color: #fff;
      }

      .contact-form h2 {
        text-align: center;
        color: #372161;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #bbb;
        border-radius: 4px;
        font: inherit;
      }

      .form-group textarea {
        min-height: 100px;
        resize: vertical;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #48487f;
        background-color: #e5edf8;
      }

      .btn-submit {
        padding: 10px 16px;
        border: none;
        border-radius: 4px;
        background-color: #263e63;
        color: #fff;
        cursor: pointer;
      }

      .btn-submit:hover {
        background-color: #3b5b89;
      }
    </style>
  </head>

  <body>
    <section id="contact">
      <form class="contact-form" action="">
        <h2>Hubungi Saya</h2>

        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>

        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan"></textarea>
        </div>

        <button class="btn-submit" type="submit">Kirim Pesan</button>
      </form>
    </section>
  </body>
</html>
