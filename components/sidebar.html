<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      .layout {
        display: flex;
      }

      #sidebar {
        width: 25%;
        padding: 20px;
        color: #fff8e8;
        background-color: #8c4b1f;
      }

      #sidebar nav {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #sidebar a {
        color: #fff8e8;
        text-decoration: none;
      }

      #sidebar a:hover {
        color: #ffd36b;
      }

      .main-content {
        width: 75%;
        padding: 30px;
        background-color: #ffd36b;
      }

      .main-content h1,
      .main-content p {
        color: #8c4b1f;
        line-height: 1.6;
      }

      footer {
        padding: 14px;
        text-align: center;
        background-color: #f0dfc2;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside id="sidebar">
        <h3>Menu</h3>
        <nav>
          <a href="#profil">Profil</a>
          <a href="#proyek">Proyek</a>
          <a href="#keahlian">Keahlian</a>
          <a href="#kontak">Kontak</a>
        </nav>
      </aside>

      <main class="main-content">
        <h1 id="profil">Profil Saya</h1>
        <p>Halo! Saya Stevan Ng, seorang pelajar yang sedang belajar membuat halaman web dengan HTML dan CSS.</p>
        <p id="proyek">Proyek saya adalah HTML ini.</p>
        <p id="keahlian">Saya ahli dalam HTML, CSS, C++, Lua, Python.</p>
      </main>
    </div>

    <footer>
      <a href="#home">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
