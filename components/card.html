<!-- Tanpa box-sizing: 320px + padding kiri/kanan 40px + border 4px = 364px -->
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Proyek</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #f4f6f8;
        color: #333;
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: 320px;
        margin: 30px auto;
        padding: 20px;
        border: 2px solid #09040f;
        background-color: #fff;
      }

      .card img {
        display: block;
        width: 100%;
        height: 160px;
        object-fit: cover;
      }

      .card h3 {
        margin-bottom: 8px;
        color: #10154b;
      }

      .card p,
      .card a {
        font-size: 15px;
      }

      .card a {
        color: #906df9;
      }

      footer {
        margin: -15px auto 30px;
        text-align: center;
      }

      footer a {
        font-size: 15px;
        color: #432fb3;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="card">
        <img src="../assets/images/proyek-kartu.png" alt="Gambar proyek Chart Weaver" />
        <h3>Chart Weaver</h3>
        <p>
          Game ini saya buat pada 2025 dan dirilis pada 2026. Chart Weaver dibuat menggunakan bahasa Lua dan sebuah
          framework.
        </p>
        <a href="https://github.com/skahds/price-game">Lihat proyek</a>
      </div>

      <footer>
        <a href="#home">Kembali ke Beranda</a>
      </footer>
    </main>
  </body>
</html>
